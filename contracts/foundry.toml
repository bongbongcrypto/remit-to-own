[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 120
tab_width = 4
