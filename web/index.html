<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remit-to-Own</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23101725%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2213%22%20width%3D%225%22%20height%3D%227%22%20rx%3D%221.6%22%20fill%3D%22%234f7dff%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2213%22%20width%3D%225%22%20height%3D%227%22%20rx%3D%221.6%22%20fill%3D%22%232b3648%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2213%22%20width%3D%225%22%20height%3D%227%22%20rx%3D%221.6%22%20fill%3D%22%232b3648%22%2F%3E%3Crect%20x%3D%2226%22%20y%3D%2213%22%20width%3D%221%22%20height%3D%227%22%20rx%3D%220.5%22%20fill%3D%22%232b3648%22%2F%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" />
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --paper:#f5f7fa; --card:#ffffff; --sunk:#eef1f6;
  --ink:#101725; --ink2:#525d73; --ink3:#656e80;
  --rule:#dfe5ee; --rule2:#eaeff5;
  --accent:#1b45d6; --accent-soft:#e8edfd;
  --on:#0a7355; --on-soft:#e2f2ec;
  --off:#8f5608; --off-soft:#faeedb;
  --own-bg:#101725; --own-fg:#f5f7fa; --own-dim:#9aa6bc;
  --own-sunk:#1b2432; --own-rule:#2b3648; --own-fill:#5eead4;
  --toast-bg:#101725; --toast-fg:#f5f7fa; --toast-dim:#a9b4c8; --toast-led:#22e08d;
  --shadow:0 1px 2px rgba(16,23,37,.05), 0 8px 24px -12px rgba(16,23,37,.14);
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-cond:"IBM Plex Sans Condensed", var(--font-body);
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --lh:1.55;
}
html[lang="ko"] { --font-body:"IBM Plex Sans","IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; --lh:1.68; }
html[lang="ja"] { --font-body:"IBM Plex Sans","IBM Plex Sans JP","Yu Gothic",system-ui,sans-serif; --lh:1.72; }
html[lang="zh"] { --font-body:"IBM Plex Sans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; --lh:1.72; }
html[lang="ko"], html[lang="ja"], html[lang="zh"] { --font-cond:var(--font-body); }
/* Korean wraps at word boundaries; without this "30일" splits after the digits */
html[lang="ko"] body { word-break:keep-all; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0b0f16; --card:#131a25; --sunk:#0e141d;
    --ink:#e9edf4; --ink2:#a2adc0; --ink3:#8d97ab;
    --rule:#232c3b; --rule2:#1b2431;
    --accent:#7f9fff; --accent-soft:#1a2440;
    --on:#3ec495; --on-soft:#102a23;
    --off:#e0a44a; --off-soft:#2b2213;
    --own-bg:#f2f5fa; --own-fg:#101725; --own-dim:#56617a;
    --own-sunk:#ffffff; --own-rule:#d8e0ec; --own-fill:#0a7355;
    --toast-bg:#1e2836; --toast-fg:#e9edf4; --toast-dim:#aab5c8; --toast-led:#3ec495;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --paper:#0b0f16; --card:#131a25; --sunk:#0e141d;
  --ink:#e9edf4; --ink2:#a2adc0; --ink3:#8d97ab;
  --rule:#232c3b; --rule2:#1b2431;
  --accent:#7f9fff; --accent-soft:#1a2440;
  --on:#3ec495; --on-soft:#102a23;
  --off:#e0a44a; --off-soft:#2b2213;
  --own-bg:#f2f5fa; --own-fg:#101725; --own-dim:#56617a;
  --own-sunk:#ffffff; --own-rule:#d8e0ec; --own-fill:#0a7355;
  --toast-bg:#1e2836; --toast-fg:#e9edf4; --toast-dim:#aab5c8; --toast-led:#3ec495;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

/* ------------------------------------------------------------------- base */
*,*::before,*::after { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:var(--lh);
  -webkit-font-smoothing:antialiased; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
.wrap { max-width:1080px; margin:0 auto; padding:0 28px 72px; }
.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
.label { font-family:var(--font-cond); font-weight:600; font-size:11.5px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); line-height:1.3; }

/* --------------------------------------------------------------- masthead */
header { border-bottom:1px solid var(--rule); background:var(--card); }
.mast { max-width:1080px; margin:0 auto; padding:30px 28px 34px;
  display:flex; flex-wrap:wrap; gap:20px 32px; align-items:flex-start;
  justify-content:space-between; }
.brand { display:flex; flex-direction:column; gap:12px; flex:1 1 34ch;
  min-width:min(100%,30ch); }
.wordmark { font-size:17px; font-weight:600; letter-spacing:.015em; line-height:1;
  display:flex; align-items:center; gap:9px; color:var(--ink2); }
.wordmark .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
  flex:none; }
.tagline { color:var(--ink); font-size:26px; font-weight:600;
  letter-spacing:-.021em; line-height:1.28; max-width:26ch; margin:0;
  text-wrap:balance; }
html[lang="ko"] .tagline, html[lang="ja"] .tagline, html[lang="zh"] .tagline {
  font-size:24px; line-height:1.42; max-width:24ch; }

.langs { display:flex; gap:2px; padding:3px; background:var(--sunk);
  border:1px solid var(--rule); border-radius:9px; flex:none; }
.langs button { font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border:0; background:transparent; color:var(--ink2);
  padding:6px 12px; border-radius:6px; line-height:1.4; }
.langs button:hover { color:var(--ink); }
.langs button[aria-pressed="true"] { background:var(--card); color:var(--ink);
  box-shadow:0 1px 2px rgba(16,23,37,.08); }

/* ------------------------------------------------------------------ steps */
.how { display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:12px;
  overflow:hidden; margin:26px 0 26px; }
.step { background:var(--card); padding:20px 22px 22px; display:flex;
  flex-direction:column; gap:7px; }
.step .n { font-family:var(--font-mono); font-size:11px; font-weight:500;
  color:var(--accent); letter-spacing:.04em; display:flex; align-items:center;
  gap:8px; }
.step .n::after { content:""; height:1px; flex:1; background:var(--rule); }
.step h2 { margin:0; font-size:15.5px; font-weight:600; letter-spacing:-.008em;
  text-wrap:balance; }
.step p { margin:0; font-size:13.5px; color:var(--ink2); }

/* ------------------------------------------------------------------ picker */
.picker { display:flex; flex-wrap:wrap; gap:7px; align-items:center;
  margin-bottom:18px; }
.chip { font:inherit; font-size:13px; cursor:pointer; padding:7px 13px;
  border-radius:999px; border:1px solid var(--rule); background:var(--card);
  color:var(--ink2); display:inline-flex; align-items:center; gap:8px;
  line-height:1.35; }
.chip:hover { color:var(--ink); border-color:var(--ink3); }
.chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink);
  color:var(--paper); }
.chip .tick { width:6px; height:6px; border-radius:50%; flex:none;
  background:var(--on); }
.chip[data-s="off"] .tick { background:var(--off); }
.chip[data-s="owned"] .tick { background:var(--accent); }

/* ---------------------------------------------------------------- columns */
.cols { display:grid; grid-template-columns:1.35fr .85fr; gap:20px;
  align-items:start; }
@media (max-width:940px) { .cols { grid-template-columns:1fr; } }
@media (max-width:720px) { .how { grid-template-columns:1fr; } }

.panel { background:var(--card); border:1px solid var(--rule);
  border-radius:14px; box-shadow:var(--shadow); }

/* -------------------------------------------------------------- statement */
.stmt { padding:24px 26px 26px; display:flex; flex-direction:column; gap:22px; }
.stmt-top { display:flex; flex-wrap:wrap; gap:12px 16px;
  justify-content:space-between; align-items:flex-start; }
.asset { display:flex; flex-direction:column; gap:5px; }
.asset .name { font-size:19px; font-weight:600; letter-spacing:-.014em;
  margin:0; }
.pill { display:inline-flex; align-items:center; gap:7px; align-self:flex-start;
  padding:5px 12px 5px 10px; border-radius:999px; font-size:12.5px;
  font-weight:600; line-height:1.4; white-space:nowrap; }
.pill .led { width:7px; height:7px; border-radius:50%; flex:none;
  background:currentColor; }
.pill[data-s="on"] { background:var(--on-soft); color:var(--on); }
.pill[data-s="off"] { background:var(--off-soft); color:var(--off); }
.pill[data-s="owned"] { background:var(--accent-soft); color:var(--accent); }
.substate { font-size:13.5px; color:var(--ink2); max-width:52ch; }

.hero { display:flex; flex-direction:column; gap:9px; }
.hero .figure { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.hero .amount { font-size:40px; font-weight:700; letter-spacing:-.028em;
  line-height:1.02; font-variant-numeric:tabular-nums; }
.hero .cur { font-size:16px; font-weight:600; color:var(--ink2); }
.hero .under { font-size:13.5px; color:var(--ink2); display:flex;
  flex-wrap:wrap; align-items:center; gap:0 10px; }
.hero .under .sep { width:3px; height:3px; border-radius:50%;
  background:var(--ink3); opacity:.6; flex:none; }

/* Installments, not a percentage. Field research is blunt about this: buyers
   judge these purchases by the size of one instalment, and the thing they can
   never find out is how many are left. So the track is countable. */
.track { display:flex; gap:2px; height:15px; }
.track .seg { flex:1 1 0; border-radius:2px; background:var(--sunk);
  border:1px solid var(--rule2); overflow:hidden; position:relative;
  min-width:3px; }
.track .seg::after { content:""; position:absolute; inset:0;
  width:var(--f,0%); background:var(--accent);
  transition:width .6s cubic-bezier(.22,.61,.36,1); }
.track.plain { display:block; height:10px; border-radius:999px;
  background:var(--sunk); overflow:hidden; border:1px solid var(--rule2); }
.track.plain .fill { height:100%; background:var(--accent); border-radius:999px;
  transition:width .6s cubic-bezier(.22,.61,.36,1); min-width:3px; }

.facts { display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:11px;
  overflow:hidden; }
@media (max-width:600px) {
  .facts { grid-template-columns:repeat(2,1fr); }
  /* keep the instalment blocks countable when the column narrows */
  .track { gap:1px; height:13px; }
  .track .seg { border-radius:1px; min-width:2px; }
}
.fact { background:var(--card); padding:13px 14px 14px; display:flex;
  flex-direction:column; gap:5px; }
.fact .v { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
  letter-spacing:-.006em; }
.fact .v small { font-weight:400; color:var(--ink2); font-size:12.5px; }

.lock { display:flex; gap:11px; padding:14px 16px; border-radius:11px;
  background:var(--sunk); border:1px solid var(--rule2);
  font-size:13.5px; color:var(--ink2); }
.lock .mark { flex:none; width:18px; height:18px; margin-top:1px; }
.lock strong { color:var(--ink); font-weight:600; }

.payto { border:1px dashed var(--rule); border-radius:12px; padding:15px 16px;
  display:flex; flex-direction:column; gap:10px; }
.payto .addr-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.payto .addr { font-family:var(--font-mono); font-size:13.5px; font-weight:500;
  word-break:break-all; flex:1 1 22ch; letter-spacing:-.01em; }
.btn { font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
  border:1px solid var(--rule); background:var(--sunk); color:var(--ink);
  padding:7px 13px; border-radius:8px; flex:none; line-height:1.4; }
.btn:hover { border-color:var(--ink3); }
.payto .note { font-size:12.5px; color:var(--ink3); }

/* Owned inverts the statement against whichever theme is showing: the meter has
   stopped mattering, so the card stops looking like the rest of the page. */
.panel[data-owned="1"] { background:var(--own-bg); border-color:var(--own-bg);
  color:var(--own-fg); }
.panel[data-owned="1"] .substate,
.panel[data-owned="1"] .hero .under,
.panel[data-owned="1"] .lock,
.panel[data-owned="1"] .fact .v small { color:var(--own-dim); }
.panel[data-owned="1"] .label { color:var(--own-dim); }
.panel[data-owned="1"] .hero .cur { color:var(--own-dim); }
.panel[data-owned="1"] .facts { background:var(--own-rule); }
.panel[data-owned="1"] .fact { background:var(--own-sunk); }
.panel[data-owned="1"] .lock { background:var(--own-sunk);
  border-color:var(--own-rule); }
.panel[data-owned="1"] .lock strong { color:var(--own-fg); }
.panel[data-owned="1"] .track.plain { background:var(--own-rule);
  border-color:var(--own-rule); }
.panel[data-owned="1"] .track .seg { background:var(--own-sunk);
  border-color:var(--own-rule); }
.panel[data-owned="1"] .track .seg::after,
.panel[data-owned="1"] .track .fill { background:var(--own-fill); }
.panel[data-owned="1"] .pill[data-s="owned"] { background:var(--own-fill);
  color:var(--own-bg); }
.panel[data-owned="1"] .hero .under .sep { background:var(--own-dim); }

/* ----------------------------------------------------------------- record */
.rec-head { padding:17px 20px 15px; border-bottom:1px solid var(--rule);
  display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.rec-head .count { font-size:12.5px; color:var(--ink3);
  font-variant-numeric:tabular-nums; }
.rec-list { list-style:none; margin:0; padding:0; max-height:520px;
  overflow-y:auto; }
.rec-list li { padding:14px 20px; border-bottom:1px solid var(--rule2);
  display:flex; flex-direction:column; gap:6px; }
.rec-list li:last-child { border-bottom:0; }
.rec-row { display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; }
.rec-amt { font-size:15.5px; font-weight:600; font-variant-numeric:tabular-nums;
  letter-spacing:-.01em; }
.rec-amt .plus { color:var(--on); }
.rec-when { font-size:12px; color:var(--ink3); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.rec-meta { display:flex; justify-content:space-between; gap:12px;
  font-size:12.5px; color:var(--ink2); flex-wrap:wrap; }
.rec-meta .who { font-family:var(--font-mono); font-size:12px;
  color:var(--ink3); }
.rec-note { font-size:12px; color:var(--off); background:var(--off-soft);
  padding:6px 9px; border-radius:7px; }
.rec-empty { padding:26px 20px; color:var(--ink3); font-size:13.5px; }
.rec-warn { padding:13px 20px; color:var(--off); background:var(--off-soft);
  font-size:12.5px; display:flex; gap:12px; align-items:center;
  justify-content:space-between; border-bottom:1px solid var(--rule2); }
.rec-warn .btn { flex:none; }

.side { display:flex; flex-direction:column; gap:20px; }
.verify { padding:18px 20px 19px; display:flex; flex-direction:column; gap:12px; }
.verify p { margin:0; font-size:13px; color:var(--ink2); }
.verify dl { margin:0; display:grid; grid-template-columns:auto 1fr;
  gap:8px 14px; align-items:baseline; }
.verify dt { font-size:12.5px; color:var(--ink3); white-space:nowrap; }
.verify dd { margin:0; font-family:var(--font-mono); font-size:12.5px;
  text-align:right; word-break:break-all; }
.rec-list li.fresh { animation:slide .5s cubic-bezier(.22,.61,.36,1); }
@keyframes slide { from { opacity:0; transform:translateY(-8px); } }

/* ----------------------------------------------------------------- toasts */
.toasts { position:fixed; right:20px; bottom:20px; display:flex;
  flex-direction:column; gap:9px; z-index:50; max-width:min(370px,calc(100vw - 40px)); }
.toast { background:var(--toast-bg); color:var(--toast-fg); border-radius:12px;
  padding:14px 16px; box-shadow:0 12px 32px -10px rgba(16,23,37,.55);
  display:flex; flex-direction:column; gap:4px;
  animation:pop .42s cubic-bezier(.22,.61,.36,1); }
.toast .t { font-size:13.5px; font-weight:600; display:flex; gap:8px;
  align-items:center; }
.toast .t .led { width:7px; height:7px; border-radius:50%;
  background:var(--toast-led); flex:none; }
.toast .d { font-size:12.5px; color:var(--toast-dim); }
@keyframes pop { from { opacity:0; transform:translateY(10px) scale(.97); } }

/* ----------------------------------------------------------------- footer */
footer { margin-top:26px; padding-top:20px; border-top:1px solid var(--rule);
  display:flex; flex-wrap:wrap; gap:8px 26px; font-size:12.5px;
  color:var(--ink3); }
footer .f { display:flex; gap:7px; align-items:baseline; }
footer .mono { font-size:12px; }

.err { padding:14px 16px; border-radius:11px; background:var(--off-soft);
  color:var(--off); font-size:13.5px; }
.skel { color:var(--ink3); font-size:13.5px; padding:26px 20px; }

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.001ms !important;
    transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="mast">
    <div class="brand">
      <div class="wordmark"><span class="dot"></span>Remit-to-Own</div>
      <h1 class="tagline" id="tagline"></h1>
    </div>
    <div class="langs" role="group" id="langs" aria-label="Language"></div>
  </div>
</header>

<div class="wrap">
  <div class="how" id="how"></div>
  <div class="picker" id="picker"></div>

  <div class="cols">
    <section class="panel stmt" id="stmt" aria-live="polite">
      <div class="skel" id="stmt-skel"></div>
    </section>

    <div class="side">
    <section class="panel" aria-labelledby="rec-title">
      <div class="rec-head">
        <span class="label" id="rec-title"></span>
        <span class="count" id="rec-count"></span>
      </div>
      <div id="rec-body"><div class="skel" id="rec-skel"></div></div>
    </section>

    <section class="panel verify" id="verify"></section>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
/* ==================================================================== i18n */
const I18N = {
  en: {
    _name:"English", _locale:"en-GB",
    tagline:"Someone abroad pays. The machine here keeps running.",
    s1t:"A relative sends USDC",
    s1b:"On Ethereum, to this plan's own collection address. No memo, no account number, no agent in the middle.",
    s2t:"Creditcoin checks it really happened",
    s2b:"An Attestcoin proof is verified on chain by a precompile. No company confirms the payment, and none can deny it.",
    s3t:"The machine runs for the time that bought",
    s3b:"Send more and it runs longer. Cover the full price and it belongs to the buyer for good.",
    on:"Running", off:"Switched off", owned:"Owned outright",
    subOn:"Paid up until {date}.",
    subOff:"Stopped on {date}. It starts again the moment a payment is proven.",
    subNever:"Not started yet. It runs as soon as the first payment is proven.",
    subForever:"Paid up indefinitely.",
    subOwned:"Paid in full. It never switches off again.",
    heroLeft:"Still to pay to own it", heroOwned:"Nothing left to pay",
    paidOf:"{paid} paid of {total}", pct:"{n}% owned",
    fRate:"Rate", fRateV:"{amt} buys {n} days",
    fRuns:"Runs until", fRunsForever:"Never stops", fRunsNever:"Not started",
    fInst:"Installments", fInstV:"{a} of {b}",
    fPaid:"Payments proven",
    lockOn:"If nothing more arrives it stops on <strong>{date}</strong>. Sending <strong>{amt}</strong> adds <strong>{n} days</strong>.",
    lockOff:"It is off right now. Sending <strong>{amt}</strong> starts it again for <strong>{n} days</strong>.",
    lockNever:"It has not started yet. Sending <strong>{amt}</strong> starts it for <strong>{n} days</strong>.",
    lockForever:"It will not stop within any date this page can show.",
    lockOwned:"Nothing can switch it off now.",
    payTitle:"Send USDC on {chain} to",
    chain1:"Ethereum Sepolia", chain3:"Ethereum", chainOther:"chain {n}",
    vChain:"Source chain",
    payNote:"This address belongs to this plan alone. That is how the contract knows whose payment it is.",

function pickLang() {
  /* a merchant hands a buyer a link, so the language can travel in the URL */
  const asked = new URLSearchParams(location.search).get("lang");
  if (asked && I18N[asked]) return asked;
  let saved = null;
  try { saved = localStorage.getItem("rto-lang"); } catch (e) { /* blocked */ }
  if (saved && I18N[saved]) return saved;
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("ko")) return "ko";
  if (n.startsWith("ja")) return "ja";
  if (n.startsWith("zh")) return "zh";
  return "en";
}

function t(k, vars) {
  let s = I18N[lang][k] || k;
  if (vars) for (const key in vars) s = s.split("{" + key + "}").join(vars[key]);
  return s;
}
const esc = s => String(s).replace(/[&<>"]/g, c =>

/* ================================================================ helpers */
async function rpc(method, params) {
  const r = await fetch(RPC, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
async function rpcBatch(calls) {
  const r = await fetch(RPC, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(calls.map((c, i) =>
      ({ jsonrpc:"2.0", id:i, method:c[0], params:c[1] })))
  });
  const j = await r.json();
  if (!Array.isArray(j)) throw new Error("batch failed");
  return j.sort((a, b) => a.id - b.id).map(x => x.result);
}

  const n = Number(v) / 10 ** DECIMALS;
  const frac = (opt && opt.whole && Number.isInteger(n)) ? 0 : 2;
  return n.toLocaleString(I18N[lang]._locale,
    { minimumFractionDigits: frac, maximumFractionDigits: frac });
}

};

/* Every group here is rebuilt wholesale rather than patched, which drops a
   keyboard user back to the top of the page. Put them back where they were. */
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return "#" + el.id;
  if (el.dataset && el.dataset.l) return '#langs [data-l="' + el.dataset.l + '"]';
  if (el.dataset && el.dataset.id) return '#picker [data-id="' + el.dataset.id + '"]';
  return null;
}
function keepFocus(run) {
  const key = focusKey(document.activeElement);
  run();
  if (!key) return;
  const again = document.querySelector(key);
  if (again && again !== document.activeElement) again.focus();
}

    '<button type="button" data-l="' + k + '" aria-pressed="' + (k === lang) +
    '" lang="' + k + '">' + esc(I18N[k]._name) + "</button>").join("");
  document.querySelectorAll("#langs button").forEach(b =>
    b.addEventListener("click", () => setLang(b.dataset.l)));

  document.getElementById("how").innerHTML = [1, 2, 3].map(i =>
    '<div class="step"><span class="n">' + i + '</span><h2>' +
    esc(T("s" + i + "t")) + "</h2><p>" + esc(T("s" + i + "b")) + "</p></div>").join("");

  document.getElementById("rec-title").textContent = T("recTitle");
  document.getElementById("footer").innerHTML =
    '<span class="f"><span class="label">' + esc(T("fContract")) +
      '</span> <a class="mono" href="' + EXPLORER + "/address/" + CONTRACT +
      '" target="_blank" rel="noopener">' + shortAddr(CONTRACT) + "</a></span>" +
    '<span class="f">' + esc(T("fChain")) + "</span>" +
    '<span class="f">' + esc(T("fSource")) + "</span>";
}
function setLang(l) {
  if (!I18N[l] || l === lang) return;
  lang = l;
  try { localStorage.setItem("rto-lang", l); } catch (e) { /* blocked */ }
  keepFocus(paintChrome);
  renderPicker();
  renderStatement();
  renderRecord();
  renderVerify();
}

/* =========================================================== plan loading */
async function loadPlans() {
  const n = Number(bn((await rpc("eth_call",
    [{ to:CONTRACT, data:SEL_COUNT }, "latest"])).slice(2)));
  if (!n) return [];
  const ids = (await rpcBatch(Array.from({ length:n }, (_, i) =>
    ["eth_call", [{ to:CONTRACT,
      data: SEL_PLAN_IDS + i.toString(16).padStart(64, "0") }, "latest"]])));
  const res = await rpcBatch(ids.flatMap(id => [
    ["eth_call", [{ to:CONTRACT, data:SEL_GET_PLAN + id.slice(2) }, "latest"]],
    ["eth_call", [{ to:CONTRACT, data:SEL_CURRENCY + id.slice(2) }, "latest"]]
  ]));
  return ids.map((id, k) => {
    const a = res[2 * k].slice(2), b = res[2 * k + 1].slice(2);
    return {
      id,
      collector: ad(w(a, 2)),
      price: bn(w(a, 3)),
      paid: bn(w(a, 4)),
      activeUntil: bn(w(a, 5)),
      settled: bn(w(a, 7)) === 1n,
      chainKey: Number(bn(w(b, 0))),
      token: ad(w(b, 1)),
      installment: bn(w(b, 2)),
      days: Number(bn(w(b, 3)))
    };
  }).reverse();   // newest opened first
}
function stateOf(p) {
  if (p.settled) return "owned";
  return p.activeUntil > BigInt(Math.floor(Date.now() / 1000)) ? "on" : "off";
}
function nameOf(p) {
  const n = NAMES[p.id];
  return n ? (n[lang] || n.en) : T("plan") + " " + p.id.slice(2, 8);
}

/* ================================================================= picker */
function renderPicker() {
  keepFocus(paintPicker);
}
function paintPicker() {
  document.getElementById("picker").innerHTML = plans.map(p =>
    '<button type="button" class="chip" data-id="' + p.id + '" data-s="' +
    stateOf(p) + '" aria-pressed="' + (current && p.id === current.id) +
    '"><span class="tick"></span>' + esc(nameOf(p)) + "</button>").join("");
  document.querySelectorAll("#picker .chip").forEach(el =>
    el.addEventListener("click", () => select(el.dataset.id)));
}

/* ============================================================== statement */
function renderStatement() { keepFocus(paintStatement); }
function paintStatement() {
  const el = document.getElementById("stmt");
  if (!current) { el.innerHTML = '<div class="skel">' + esc(T("loading")) + "</div>"; return; }
  const p = current, st = stateOf(p);
  const owned = st === "owned";
  const left = p.price > p.paid ? p.price - p.paid : 0n;
  /* Scale before dividing or the integer division throws away the digit that
     is about to be displayed, and round explicitly because (3.05).toFixed(1)
     answers "3.0" in binary floating point. */
  const pct = p.price > 0n ? Number((p.paid * 1000000n) / p.price) / 10000 : 0;
  const until = Number(p.activeUntil);
  const forever = owned || p.activeUntil > DATE_MAX;
  const instDone = p.installment > 0n ? Number((p.paid * 10000n) / p.installment) / 10000 : 0;
  const instAll = p.installment > 0n ? Number((p.price * 10000n) / p.installment) / 10000 : 0;

  /* a plan that has never been paid has no stop date; rendering activeUntil 0
     as a date announces that the machine stopped on 1 January 1970 */
  const never = !forever && p.activeUntil < DATE_MIN;

  const sub = owned ? T("subOwned")
    : never ? T("subNever")
    : forever ? T("subForever")
    : st === "on" ? t("subOn", { date: dateOf(until) })
    : t("subOff", { date: dateOf(until) });

  const inst1 = amt(p.installment, { whole:true });
  const lock = owned ? T("lockOwned")
    : never ? t("lockNever", { amt: inst1, n: p.days })
    : forever ? T("lockForever")
    : st === "on"
      ? t("lockOn", { date: dateOf(until), amt: inst1, n: p.days })
      : t("lockOff", { amt: inst1, n: p.days });

  lastPaintedState = st;
  el.setAttribute("data-owned", owned ? "1" : "0");
  el.innerHTML =
    '<div class="stmt-top">' +
      '<div class="asset">' +
        '<h2 class="name">' + esc(nameOf(current)) + "</h2>" +
        '<span class="pill" data-s="' + st + '"><span class="led"></span>' +
        esc(T(st)) + "</span></div>" +
      '<p class="substate">' + esc(sub) + "</p>" +
    "</div>" +

    '<div class="hero">' +
      '<span class="label">' + esc(owned ? T("heroOwned") : T("heroLeft")) + "</span>" +
      '<span class="figure"><span class="amount">' + money(left) +
        '</span><span class="cur">' + SYMBOL + "</span></span>" +
      track(instDone, instAll, pct) +
      '<span class="under"><span>' +
        esc(t("paidOf", { paid: money(p.paid), total: amt(p.price, { whole:true }) })) +
        '</span><span class="sep"></span><span>' +
        esc(t("pct", { n: dec1(pct) })) + "</span></span>" +
    "</div>" +

    '<div class="facts">' +
      fact(T("fRate"), esc(t("fRateV", { amt: inst1, n: p.days }))) +
      fact(T("fRuns"), forever
        ? "<small>" + esc(T("fRunsForever")) + "</small>"
        : never ? "<small>" + esc(T("fRunsNever")) + "</small>"
        : esc(dateOf(until))) +
      fact(T("fInst"), esc(t("fInstV",
        { a: dec1(instDone).replace(/\.0$/, ""), b: Math.round(instAll) }))) +
      fact(T("fPaid"), recordState === "ok" ? String(events.length)
        : recordState === "partial" ? String(events.length) + "+"
        : "<small>" + esc(T("unknown")) + "</small>") +
    "</div>" +

    '<div class="lock"><svg class="mark" viewBox="0 0 20 20" fill="none" aria-hidden="true">' +
      '<circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.4"/>' +
      '<path d="M10 6v4.6l3 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
      "</svg><span>" + lock + "</span></div>" +

    (owned ? "" :
      '<div class="payto">' +
        '<span class="label">' + esc(t("payTitle", { chain: chainName(p.chainKey) })) + "</span>" +
        '<div class="addr-row"><span class="addr">' + esc(p.collector) + "</span>" +
        '<button type="button" class="btn" id="copy">' + esc(T("copy")) + "</button></div>" +
        '<span class="note">' + esc(T("payNote")) + "</span>" +
      "</div>");

  const c = document.getElementById("copy");
  if (c) c.addEventListener("click", async () => {
    /* Claiming a copy that did not happen invites pasting the wrong address,
       so a refused clipboard selects the text and says what to press. */
    let ok = false;
    try { await navigator.clipboard.writeText(p.collector); ok = true; }
    catch (e) { ok = false; }
    if (!ok) selectText(document.querySelector(".payto .addr"));
    c.textContent = ok ? T("copied") : T("copyManual");
    setTimeout(() => { c.textContent = T("copy"); }, ok ? 1600 : 4000);
  });
}
function selectText(el) {
  if (!el) return;
  const r = document.createRange();
  r.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

const chainName = k => I18N[lang]["chain" + k] || t("chainOther", { n: k });

const fact = (k, v) =>
  '<div class="fact"><span class="label">' + esc(k) + '</span><span class="v">' + v + "</span></div>";

/* The claim this project makes is that nobody stands between the payment and
   the machine, so the page says exactly where to go and check that. */
const PRECOMPILE = "0x0000000000000000000000000000000000000FD2";
function renderVerify() {
  const link = (href, text) => '<a href="' + href +
    '" target="_blank" rel="noopener">' + esc(text) + "</a>";
  document.getElementById("verify").innerHTML =
    '<span class="label">' + esc(T("vTitle")) + "</span>" +
    "<p>" + esc(T("vBody")) + "</p>" +
    "<dl>" +
      "<dt>" + esc(T("vContract")) + "</dt><dd>" +
        link(EXPLORER + "/address/" + CONTRACT, shortAddr(CONTRACT)) + "</dd>" +
      (current ? "<dt>" + esc(T("vPlan")) + "</dt><dd>" +
        link(EXPLORER + "/address/" + CONTRACT + "?tab=logs",
             current.id.slice(0, 6) + "…" + current.id.slice(-4)) + "</dd>" +
        "<dt>" + esc(T("vChain")) + "</dt><dd>" + esc(chainName(current.chainKey)) + "</dd>" : "") +
      "<dt>" + esc(T("vProof")) + "</dt><dd>0x…0FD2</dd>" +
    "</dl>";
}

/* One block per instalment while that stays countable, so the reader can see
   how many are left instead of decoding a percentage. */
function track(done, total, pct) {
  const n = Math.round(total);
  const aria = t("fInstV", { a: dec1(done).replace(/\.0$/, ""), b: n });
  if (!(n >= 2 && n <= 60)) {
    return '<div class="track plain" role="img" aria-label="' + esc(aria) +
      '"><div class="fill" style="width:' +
      Math.max(0, Math.min(100, pct)) + '%"></div></div>';
  }
  let out = '<div class="track" role="img" aria-label="' + esc(aria) + '">';
  for (let i = 0; i < n; i++) {
    const f = Math.max(0, Math.min(1, done - i));
    out += '<span class="seg" style="--f:' + (f * 100).toFixed(1) + '%"></span>';
  }
  return out + "</div>";
}

/* ================================================================= record */
function renderRecord(freshKey) {
  const body = document.getElementById("rec-body");
  const count = document.getElementById("rec-count");
  count.textContent = events.length ? t("recCount", { n: events.length }) : "";
  if (recordState === "failed") {
    body.innerHTML = '<div class="rec-warn">' + esc(T("recFailed")) +
      '<button type="button" class="btn" id="rec-retry">' + esc(T("recRetry")) +
      "</button></div>";
    const b2 = document.getElementById("rec-retry");
    if (b2 && current) b2.addEventListener("click", () => select(current.id));
    return;
  }
  if (!events.length) {
    body.innerHTML = '<div class="rec-empty">' + esc(T("recEmpty")) + "</div>";
    return;
  }
  const price = current ? current.price : 0n;
  const rows = events.slice().reverse().map(e => {
    const leftAfter = price > e.paidTotal ? price - e.paidTotal : 0n;
    const capped = e.amount > e.credited;
    return '<li class="' + (e.key === freshKey ? "fresh" : "") + '">' +
      '<div class="rec-row"><span class="rec-amt"><span class="plus">+</span>' +
        money(e.credited) + " " + SYMBOL + "</span>" +
        '<span class="rec-when">' + esc((e.time && stampOf(e.time)) || "#" + e.block) + "</span></div>" +
      '<div class="rec-meta"><span>' +
        esc(leftAfter > 0n ? t("recLeftAfter", { amt: amt(leftAfter) }) : T("recSettledRow")) +
        "</span>" + payerCell(e) + "</div>" +
      (capped ? '<div class="rec-note">' + esc(T("recCapped")) + "</div>" : "") +
      "</li>";
  }).join("");
  body.innerHTML = (recordState === "partial"
      ? '<div class="rec-warn">' + esc(T("recPartial")) + "</div>" : "") +
    '<ul class="rec-list">' + rows + "</ul>";
}

function payerCell(e) {
  const who = e.payer ? esc(shortAddr(e.payer)) : "";
  if (!who) return "";
  if (!e.tx) return '<span class="who">' + who + "</span>";
  return '<a class="who" href="' + esc(EXPLORER + "/tx/" + e.tx) +
    '" target="_blank" rel="noopener">' + who + "</a>";
}

/* ============================================================ log reading */
/* Log fields arrive from a public node and a third party indexer. They are
   only ever hex, so anything that is not hex is not rendered as a link. */
const isHex = (v, n) => typeof v === "string" &&
  v.length === n + 2 && v.slice(0, 2) === "0x" && /^[0-9a-fA-F]+$/.test(v.slice(2));

function decodeLog(lg) {
  const d = lg.data.replace(/^0x/, "");
  const tx = isHex(lg.transactionHash, 64) ? lg.transactionHash : null;
  const payer = ad(lg.topics[2].slice(2));
  return {
    key: lg.transactionHash + ":" + lg.logIndex,
    tx,
    payer: isHex(payer, 40) ? payer : null,
    amount: bn(w(d, 0)),
    paidTotal: bn(w(d, 1)),
    activeUntil: bn(w(d, 2)),
    block: typeof lg.blockNumber === "string" ? hexnum(lg.blockNumber) : lg.blockNumber,
    time: lg.timeStamp ? hexnum(lg.timeStamp) : null,
    credited: 0n
  };
}
/* The credited figure is the change in paidTotal, not the raw transfer: the
   contract takes only what is still owed and leaves the rest. */
function fillCredited() {
  let prev = 0n;
  for (const e of events) { e.credited = e.paidTotal - prev; prev = e.paidTotal; }
}

/* Telling somebody who has been paying that no payment exists is the single
   worst thing this page can do, so a failed read is never reported as an empty
   history. It falls back to whatever the node can still see and says so. */
async function historyFromIndexer(planId) {
  const u = EXPLORER + "/api?module=logs&action=getLogs&fromBlock=0&toBlock=latest" +
    "&address=" + CONTRACT + "&topic0=" + TOPIC_PAID + "&topic1=" + planId +
    "&topic0_1_opr=and";
  const r = await fetch(u);
  if (!r.ok) throw new Error("indexer " + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.result)) {
    if (j && j.status === "1") return [];        // a genuine empty answer
    throw new Error("indexer returned no log array");
  }
  return j.result.map(decodeLog).sort((a, b) => a.block - b.block || 0);
}

async function historyFromNode(planId) {
  const head = hexnum(await rpc("eth_blockNumber", []));
  const from = Math.max(0, head - MAX_SCAN + 1);
  const logs = await tailFromNode(planId, from, head);
  return { logs, head };
}
async function tailFromNode(planId, from, to) {
  return (await rpc("eth_getLogs", [{
    address: CONTRACT, fromBlock: "0x" + from.toString(16),
    toBlock: "0x" + to.toString(16), topics: [[TOPIC_PAID], planId]
  }])).map(decodeLog);
}

/* ================================================================ polling */
async function poll() {
  /* a slow scan must not let the next tick pile another one on top of it */
  if (!current || polling) return;
  polling = true;
  const planId = current.id;
  try {
    const head = hexnum(await rpc("eth_blockNumber", []));
    const from = lastBlock === null ? Math.max(0, head - TAIL_BLOCKS) : lastBlock + 1;
    if (from > head) return;
    /* never ask for more than the node will answer inside its query timeout;
       a long gap is closed over several polls instead of failing outright */
    const to = Math.min(head, from + MAX_SCAN - 1);
    const fresh = (await tailFromNode(planId, from, to)).filter(e => !seen.has(e.key));
    lastBlock = to;
    if (!fresh.length || planId !== current.id) return;

    fresh.forEach(e => seen.add(e.key));
    events = events.concat(fresh).sort((a, b) => a.block - b.block);
    fillCredited();

    const last = fresh[fresh.length - 1];
    Object.assign(current, {
      paid: last.paidTotal,
      activeUntil: last.activeUntil,
      settled: last.paidTotal >= current.price
    });
    renderStatement();
    renderRecord(last.key);
    renderPicker();

    const days = daysBought(last.credited, current);
    if (current.settled) toast(T("toastOwnedT"), T("toastOwnedD"));
    else toast(T("toastT"), t("toastD", { amt: amt(last.credited), n: days }));
  } catch (e) { /* a public node hiccup is not worth a visible error */ }
  finally { polling = false; }
}

/* An installment of zero would divide by zero and offer the reader Infinity
   days, so the rate is only stated when there is a rate to state. */
function daysBought(credited, plan) {
  if (!plan || plan.installment <= 0n) return 1;
  const d = Math.round(Number(credited) * plan.days / Number(plan.installment));
  return Number.isFinite(d) ? Math.max(1, Math.min(d, MAX_DAYS)) : 1;
}

function toast(title, detail) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<div class="t"><span class="led"></span>' + esc(title) +
    '</div><div class="d">' + esc(detail) + "</div>";
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 20000);
}

/* ================================================================= select */
async function select(id) {
  const p = plans.find(x => x.id === id);
  if (!p) return;
  const token = ++reqToken;
  current = p;
  if (location.hash.replace("#", "") !== id) history.replaceState(null, "", "#" + id);
  events = []; seen = new Set(); lastBlock = null;
  renderPicker();
  renderStatement();
  renderVerify();
  document.getElementById("rec-body").innerHTML =
    '<div class="skel">' + esc(T("recLoading")) + "…</div>";
  document.getElementById("rec-count").textContent = "";

  let hist = [];
  recordState = "ok";
  try {
    hist = await historyFromIndexer(id);
  } catch (indexerError) {
    /* the node cannot answer a full history inside its query timeout, so this
       is deliberately a recent window and the page admits as much */
    try {
      const partial = await historyFromNode(id);
      hist = partial.logs;
      recordState = "partial";
      lastBlock = partial.head;
    } catch (nodeError) {
      hist = [];
      recordState = "failed";
    }
  }
  if (token !== reqToken) return;

  events = hist;
  events.forEach(e => seen.add(e.key));
  fillCredited();
  if (recordState !== "partial" && events.length)
    lastBlock = events[events.length - 1].block;
  renderStatement();
  renderRecord();

  clearInterval(poller);
  polling = false;
  poller = setInterval(poll, POLL_MS);
  poll();
}

/* =================================================================== boot */
(async function boot() {
  /* the page follows the reader's theme, but a recording may want one pinned */
  const forced = new URLSearchParams(location.search).get("theme");
  if (forced === "light" || forced === "dark")
    document.documentElement.setAttribute("data-theme", forced);
  paintChrome();
  renderVerify();
  try {
    plans = await loadPlans();
  } catch (e) {
    document.getElementById("stmt").innerHTML =
      '<div class="err">' + esc(T("errPlan")) + "</div>";
    return;
  }
  renderPicker();
  const want = location.hash.replace("#", "");
  await select(plans.find(p => p.id === want) ? want : plans[0].id);
  /* the countdown wording changes as time passes even with no new payment */
  window.addEventListener("hashchange", () => {
    const id = location.hash.replace("#", "");
    if (plans.some(p => p.id === id) && (!current || current.id !== id)) select(id);
  });
  /* Nothing on the card changes with the clock except the moment the machine
     crosses from running to switched off, so redraw only then. Repainting on a
     timer would also throw a keyboard user off the card once a minute. */
  ticker = setInterval(() => {
    if (current && stateOf(current) !== lastPaintedState) renderStatement();
  }, 20000);
})();
</script>
</body>
</html>
